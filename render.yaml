# Render Blueprint: deploys the Flask API and its Postgres database.
# In Render: New -> Blueprint -> pick this repo. (The frontend goes to Netlify.)
services:
  - type: web
    name: portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      # Render generates a long random value once and keeps it
      - key: SECRET_KEY
        generateValue: true
      # You are asked for these when the Blueprint is created
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Internal connection string of the database below
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
