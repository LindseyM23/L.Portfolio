<div class="admin-login-container">
  <aside class="brand dark">
    <a routerLink="/" class="mono back-link">&larr; Back to portfolio</a>
    <p class="brand-mark">Studio<br><em>access.</em></p>
    <p class="mono brand-foot">Lindsey Monyepao &middot; Admin</p>
  </aside>

  <div class="login-card">
    <span class="mono index">(00) Restricted</span>
    <h1>Admin <em>access</em></h1>
    <p class="subtitle">Enter the password to unlock edit mode.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          [disabled]="loading"
          autocomplete="current-password"
        />
      </div>

      <div class="error mono" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Enter admin mode →' }}
      </button>
    </form>
  </div>
</div>
